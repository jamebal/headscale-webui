name: Build Docker Image

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: headscale-webui-release
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js 20.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 验证发布版本信息
        run: node scripts/release-metadata.mjs >> "$GITHUB_ENV"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - name: 安装依赖
        run: pnpm install

      - name: 构建生产版本
        run: pnpm run build:prod

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_IO_USERNAME }}
          password: ${{ secrets.GHCR_IO_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jmal/headscale-webui:build-${{ github.sha }}
            ghcr.io/${{ secrets.GHCR_IO_USERNAME }}/headscale-webui:build-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.PROJECT_VERSION }}
            io.github.jamebal.headscale-webui.headscale.compatibility=${{ env.HEADSCALE_COMPATIBILITY }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ env.PROJECT_VERSION }}
            index:io.github.jamebal.headscale-webui.headscale.compatibility=${{ env.HEADSCALE_COMPATIBILITY }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.PROJECT_VERSION }}

      - name: 提升正式镜像标签
        env:
          DOCKER_IMAGE: jmal/headscale-webui
          GHCR_IMAGE: ghcr.io/${{ secrets.GHCR_IO_USERNAME }}/headscale-webui
        run: >-
          node scripts/promote-image-tags.mjs
          "$DOCKER_IMAGE"
          "$GHCR_IMAGE"
          "$PROJECT_VERSION"
          "$HEADSCALE_COMPATIBILITY"
          "${{ github.sha }}"
