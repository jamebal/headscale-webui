name: Build Test Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js 20.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 验证发布版本信息
        run: node scripts/release-metadata.mjs >> "$GITHUB_ENV"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - name: 安装依赖
        run: pnpm install

      - name: 构建生产版本
        run: pnpm run build:prod

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_IO_USERNAME }}
          password: ${{ secrets.GHCR_IO_TOKEN }}

      - name: 构建并推送 Docker 测试镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jmal/headscale-webui:test
            ghcr.io/${{ secrets.GHCR_IO_USERNAME }}/headscale-webui:test
          labels: |
            org.opencontainers.image.version=${{ env.PROJECT_VERSION }}
            io.github.jamebal.headscale-webui.headscale.compatibility=${{ env.HEADSCALE_COMPATIBILITY }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.PROJECT_VERSION }}
